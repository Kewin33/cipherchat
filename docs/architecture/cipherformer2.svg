<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="960" viewBox="0 0 1120 960">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker></defs>
<rect x="0" y="0" width="1120" height="960" fill="#ffffff"/>
<text x="40" y="42" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">CipherFormer2 – Architektur (v2, FHE-kompatibel)</text>
<text x="40" y="66" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280" font-family="DejaVu Sans">Dekoder-only Transformer, 2 Layer, 1 Head, d = 64, kein LayerNorm, kein Softmax</text>
<rect x="200" y="90" width="460" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
<text x="430.0" y="112" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">Eingabe: Token-ID → One-Hot</text>
<text x="430.0" y="134" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">Vokabular 59 + konstanter Kanal x[63] = 1 (trägt alle Biases)</text>
<line x1="430" y1="146" x2="430" y2="180" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="200" y="180" width="220" height="58" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="310.0" y="202" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">E_attn (d = 64)</text>
<text x="310.0" y="224" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">Eingang der Attention</text>
<rect x="440" y="180" width="220" height="58" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="550.0" y="202" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">E_res (d = 64)</text>
<text x="550.0" y="224" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">Residualstrom</text>
<line x1="310" y1="238" x2="310" y2="262" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="550" y1="238" x2="550" y2="262" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="130" y="262" width="600" height="232" rx="12" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="140" y="280" font-size="12" text-anchor="start" font-weight="bold" fill="#6b7280" font-family="DejaVu Sans">Layer 0 (Lookup-Schicht)</text>
<rect x="160" y="292" width="250" height="150" rx="8" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="285.0" y="314" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">Attention (1 Head, kausal)</text>
<text x="285.0" y="336" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">q = x·Wq,  k = x·Wk,  v = x·Wv</text>
<text x="285.0" y="355" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">s_tj = q_t·k_j + c + ρ[t−j]</text>
<text x="285.0" y="374" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">w_tj = κ · s_tj²</text>
<text x="285.0" y="393" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">out = Σ_j w_tj · v_j</text>
<rect x="450" y="292" width="250" height="150" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="575.0" y="314" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">kein MLP (Layer 0)</text>
<text x="575.0" y="336" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">Bei One-Hot-Eingabe ist ein MLP</text>
<text x="575.0" y="355" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">nur eine Tabelle: E_attn und E_res</text>
<text x="575.0" y="374" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">übernehmen diese Rolle.</text>
<line x1="130" y1="322" x2="130" y2="474" stroke="#b45309" stroke-width="1.4"/>
<line x1="130" y1="474" x2="404" y2="474" stroke="#b45309" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="285.0" y1="442" x2="285.0" y2="472" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="575.0" y1="442" x2="575.0" y2="472" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="285.0" y1="472" x2="416" y2="472" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="575.0" y1="472" x2="444" y2="472" stroke="#9ca3af" stroke-width="1.4"/>
<circle cx="430" cy="474" r="12" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
<text x="430" y="479" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">+</text>
<text x="452" y="478" font-size="12" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">x ← x + α_a·Attn + α_m·MLP</text>
<line x1="430" y1="494" x2="430" y2="516" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="130" y="516" width="600" height="232" rx="12" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="140" y="534" font-size="12" text-anchor="start" font-weight="bold" fill="#6b7280" font-family="DejaVu Sans">Layer 1 (letzter Layer bei L = 2)</text>
<rect x="160" y="546" width="250" height="150" rx="8" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="285.0" y="568" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">Attention (1 Head, kausal)</text>
<text x="285.0" y="590" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">q = x·Wq,  k = x·Wk,  v = x·Wv</text>
<text x="285.0" y="609" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">s_tj = q_t·k_j + c + ρ[t−j]</text>
<text x="285.0" y="628" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">w_tj = κ · s_tj²</text>
<text x="285.0" y="647" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">out = Σ_j w_tj · v_j</text>
<rect x="450" y="546" width="250" height="150" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="575.0" y="568" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">MLP (gated, polynomial)</text>
<text x="575.0" y="590" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">z = x·W1,  g = x·Wg</text>
<text x="575.0" y="609" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">m = (z ⊙ g)²</text>
<text x="575.0" y="628" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">out = m·W2 + b2</text>
<text x="575.0" y="647" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">Breite d_ff = 1024 bis 2048</text>
<line x1="130" y1="576" x2="130" y2="728" stroke="#b45309" stroke-width="1.4"/>
<line x1="130" y1="728" x2="404" y2="728" stroke="#b45309" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="285.0" y1="696" x2="285.0" y2="726" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="575.0" y1="696" x2="575.0" y2="726" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="285.0" y1="726" x2="416" y2="726" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="575.0" y1="726" x2="444" y2="726" stroke="#9ca3af" stroke-width="1.4"/>
<circle cx="430" cy="728" r="12" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
<text x="430" y="733" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">+</text>
<text x="452" y="732" font-size="12" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">x ← x + α_a·Attn + α_m·MLP</text>
<line x1="430" y1="748" x2="430" y2="770" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="200" y="770" width="460" height="50" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="430.0" y="792" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">Unembedding</text>
<text x="430.0" y="814" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">logits = x·Wu + b_u   (V = 59)</text>
<line x1="430" y1="820" x2="430" y2="844" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="200" y="844" width="460" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
<text x="430.0" y="866" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">Greedy-Decoding</text>
<text x="430.0" y="888" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">nächstes Token = argmax(logits)</text>
<text x="790" y="300" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">Besonderheiten für FHE</text>
<text x="790" y="326" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">• Keine LayerNorm, kein Softmax:</text>
<text x="790" y="346" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">   nur Polynome (Grad 2 bzw. 4)</text>
<text x="790" y="366" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">• Paralleler Block: Attention und</text>
<text x="790" y="386" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">   MLP lesen dieselbe Eingabe</text>
<text x="790" y="406" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">• Relativer Positions-Bias ρ[t−j]</text>
<text x="790" y="426" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">   statt absoluter Positionen</text>
<text x="790" y="446" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">• Feste Normierung κ (statt 1/(t+1))</text>
<text x="790" y="466" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">• Bilineare Scores: der Cache speichert</text>
<text x="790" y="486" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">   k̃_j = x_j·Mᵀ, keine q-Projektion</text>
<text x="790" y="506" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">• Layer 0 ohne MLP: Embedding-Lookup</text>
<text x="790" y="526" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">• Schiebender KV-Cache: pro Token um</text>
<text x="790" y="546" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">   einen 128-Slot-Block (statische Plaintexts)</text>
<rect x="780" y="600" width="300" height="120" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="930.0" y="622" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">Kennzahlen (Forschungsmodell)</text>
<text x="930.0" y="644" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">d = 64, L = 2, 1 Head</text>
<text x="930.0" y="663" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">Kontext ≤ 64 Tokens</text>
<text x="930.0" y="682" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">Vokabular 59</text>
<text x="930.0" y="701" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#374151" font-family="DejaVu Sans">Additionsmodell: 428 k Parameter</text>
<text x="790" y="760" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937" font-family="DejaVu Sans">Legende</text>
<rect x="790" y="772" width="16" height="12" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="814" y="783" font-size="12" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">Attention</text>
<rect x="790" y="792" width="16" height="12" fill="#ecfdf5" stroke="#047857"/>
<text x="814" y="803" font-size="12" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">MLP</text>
<rect x="790" y="812" width="16" height="12" fill="#fef3c7" stroke="#b45309"/>
<text x="814" y="823" font-size="12" text-anchor="start" font-weight="normal" fill="#374151" font-family="DejaVu Sans">Embedding-Tabellen</text>
<text x="40" y="938" font-size="11" text-anchor="start" font-weight="normal" fill="#9ca3af" font-family="DejaVu Sans">Quelle: cipherchat/v2/model.py (CipherFormer2), erzeugt mit scripts/make_architecture_figure.py</text>
</svg>