<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CipherChat – HTTPS für LLMs (FHE-MVP)</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d212a; --line: #2a2f3a; --text: #e8eaf0; --muted: #9aa3b2;
    --accent: #6ea8fe; --ok: #4cc38a; --warn: #f0b84c; --user: #2b3a55; --bot: #20252f; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 18px 24px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
  .pill b { color: var(--text); font-weight: 600; }
  .pill.ok { border-color: #2f6b52; color: #bfe8d4; }
  main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; padding: 16px 24px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px; } header { padding: 14px; } #chat { height: 46vh; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .card h2 { font-size: 14px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .card h2 small { color: var(--muted); font-weight: 400; }
  #chat { height: 56vh; min-height: 320px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .typing::after { content: "▍"; animation: blink 1s infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .composer input { flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 15px; outline: none; }
  .composer input:focus { border-color: var(--accent); }
  button { background: var(--accent); color: #0b1220; border: 0; border-radius: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; font-size: 14px; }
  button:disabled { opacity: .5; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
  .chip { font-size: 12px; background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .log { height: 26vh; min-height: 180px; overflow-y: auto; font-family: var(--mono); font-size: 11.5px; padding: 8px 10px; }
  .row { display: grid; grid-template-columns: 34px 58px 1fr 54px; gap: 8px; padding: 4px 0; border-bottom: 1px dashed #262b35; align-items: center; }
  .row .hex { color: #c9a0ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .t { color: var(--warn); text-align: right; }
  .row .p { color: var(--muted); }
  .dec { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px dashed #262b35; align-items: center; font-size: 12px; }
  .bars { display: flex; gap: 6px; flex-wrap: wrap; }
  .bar { position: relative; background: #252a35; border-radius: 6px; padding: 2px 7px; font-family: var(--mono); overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(76,195,138,.25); }
  .bar span { position: relative; }
  .note { font-size: 12px; color: var(--muted); padding: 8px 14px 12px; border-top: 1px solid var(--line); line-height: 1.45; }
  .how { grid-column: 1 / -1; }
  .steps { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; padding: 14px; }
  @media (max-width: 900px) { .steps { grid-template-columns: 1fr 1fr; } }
  .step { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 13px; line-height: 1.45; color: var(--muted); }
  .step b { display: block; color: var(--text); margin-bottom: 4px; }
  .vswitch { display: inline-flex; gap: 4px; margin-top: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .vswitch button { background: transparent; color: var(--muted); border-radius: 9px; padding: 7px 12px; font-weight: 600; font-size: 13px; }
  .vswitch button.on { background: var(--accent); color: #0b1220; }
  .vswitch button:disabled { opacity: .35; cursor: not-allowed; }
  .pill.warn { border-color: #6b5a2f; color: #f3dba6; }
  .hot { display: flex; height: 8px; border-radius: 6px; overflow: hidden; margin-top: 6px; background: #252a35; }
  .hot i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: var(--c); }
</style>
</head>
<body>
<header>
  <h1><span>Cipher</span>Chat <small style="color:var(--muted);font-weight:400">· HTTPS für LLMs</small></h1>
  <div class="sub" id="sub">Der Server rechnet einen Transformer ausschließlich auf <b>homomorph verschlüsselten</b> Tokens (CKKS). Schlüssel &amp; Klartext verlassen nie dieses Gerät.</div>
  <div class="vswitch" id="vswitch"></div>
  <div class="pills" id="pills"><span class="pill">verbinde …</span></div>
</header>
<main>
  <section class="card">
    <h2>Chat <small id="perf"></small></h2>
    <div id="chat">
    </div>
    <div class="chips" id="chips"></div>
    <form class="composer" id="form">
      <input id="inp" autocomplete="off" maxlength="50" placeholder="Nachricht (wird lokal verschlüsselt) …">
      <button id="send">Senden</button>
    </form>
  </section>
  <div class="side">
    <section class="card">
      <h2>Was der Server sieht <small>nur Ciphertexts</small></h2>
      <div class="log" id="srv"></div>
      <div class="note" id="srvnote"></div>
    </section>
    <section class="card">
      <h2>Nur auf deinem Gerät <small>entschlüsselt</small></h2>
      <div class="log" id="cli"></div>
      <div class="note" id="clinote"></div>
    </section>
  </div>
  <section class="card how">
    <h2>So funktioniert's</h2>
    <div class="steps" id="steps"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const VERS = {
  v1: {
    sub: "v1 · MVP: ein winziger Zeichen-Transformer (2 Layer) rechnet nur auf <b>CKKS-verschlüsselten</b> Tokens (OpenFHE, CPU). Schlüssel &amp; Klartext bleiben auf diesem Gerät.",
    intro: "Hallo! Ich bin CipherChat v1 – ein winziges Sprachmodell, das deine Nachricht nur verschlüsselt sieht. Probier eine Beispielfrage. (Ich antworte kurz, oft einsilbig.)",
    examples: ["wie geht's?", "was ist 3+4?", "hauptstadt von italien?", "ist 7 gerade?", "siehst du meine daten?", "gegenteil von groß?", "zähl bis 3", "wer bist du?"],
    maxlen: 50,
    srvnote: "Pro Token: 1 Ciphertext hoch (≈2,3 MB), bei Bedarf 1 Ciphertext mit verschlüsselten Logits zurück. Der Server kennt nur Größe, Hash und Rechenzeit – wie bei HTTPS bleibt nur die Länge sichtbar.",
    clinote: "Der Client entschlüsselt die Logits mit dem Secret Key, wählt das nächste Zeichen (argmax) und verschlüsselt es für den nächsten Schritt.",
    steps: [["1 · Handshake", "Der Client erzeugt ein CKKS-Schlüsselpaar. Nur öffentliche Parameter + Evaluation-Keys gehen an den Server – wie ein TLS-Handshake, nur ohne dass der Server je entschlüsseln kann."],
            ["2 · Verschlüsseln", "Jedes Zeichen wird als One-Hot-Vektor in 8192 Slots gepackt und verschlüsselt (128-Bit-Sicherheit)."],
            ["3 · Blind rechnen", "Der Server wertet einen FHE-freundlichen Transformer aus: polynomielle Attention, Quadrat-Aktivierung, verschlüsselter KV-Cache."],
            ["4 · Entschlüsseln", "Zurück kommen verschlüsselte Logits. Nur der Client kann sie lesen und das nächste Token wählen."]],
  },
  v2: {
    sub: "v2 · Forschungs-Engine: slot-gesättigte CKKS-Engine (OpenFHE, CPU) mit CipherFormer2 – verschlüsselte Addition beliebig langer Zahlen.",
    intro: "CipherChat v2: Ich addiere Zahlen, ohne sie je zu sehen. Beispiel: 123+456=",
    examples: ["123+456=", "9999+1=", "40+2=", "31415+27182=", "7+8="],
    maxlen: 50,
    srvnote: "Pro Token ein Ciphertext (N = 2¹⁴). Generalisiertes BSGS, gehoistete Rotationen, KV-Cache als verschobener 128-Slot-Block.",
    clinote: "Zahlen werden clientseitig little-endian tokenisiert; die Antwort wird lokal entschlüsselt und zurückgedreht.",
    steps: [["1 · Handshake", "Wie v1: Schlüssel lokal, nur Evaluation-Keys gehen an den Server."],
            ["2 · Verschlüsseln", "Token + Ziffernstelle (Kopplung) in einem Ciphertext."],
            ["3 · Blind rechnen", "Slot-gesättigte Matrizen, polynomielle Attention mit relativen Positions-Biases."],
            ["4 · Entschlüsseln", "Logits lokal entschlüsseln, argmax, nächstes Token."]],
  },
  v3: {
    sub: "v3 · Qwen2.5-0.5B, <b>nicht-interaktiv</b>: alle 24 Schichten inkl. RMSNorm, Power-Softmax mit Division und Aktivierung laufen verschlüsselt auf der GPU – mit CKKS-Bootstrapping (PhantomFHE + NEXUS).",
    intro: "CipherChat v3: ein echtes 0,5B-Sprachmodell (Qwen2.5, FHE-freundlich umgebaut). Es setzt deinen Text fort – langsam: jedes Token läuft verschlüsselt durch 24 Schichten mit Bootstrapping. Kurze englische Anfänge funktionieren am besten.",
    examples: ["The capital of France is", "Water boils at", "One, two, three,", "The opposite of hot is"],
    maxlen: 120,
    srvnote: "Pro Token: 1 Ciphertext (N = 2¹⁶) hinein, 1 Ciphertext zurück – keine Zwischenrunden. Der Server rechnet Norm, Softmax-Division und Aktivierung selbst und frischt Ciphertexts per Bootstrapping auf.",
    clinote: "Client: Embedding nachschlagen + verschlüsseln; zurück kommt der verschlüsselte Residual-Vektor, daraus lokal finale RMSNorm + LM-Head → Token. Demo-Einschränkung: die Client-Schlüssel liegen noch im GPU-Prozess (PhantomFHE kann Schlüssel nicht exportieren).",
    steps: [["1 · Schlüssel", "CKKS N = 2¹⁶, 128 Bit (log QP 1480, h = 192); ~42 Rotationsschlüssel ≈ 6,8 GB auf der GPU."],
            ["2 · Verschlüsseln", "Embedding des Tokens (896 Werte), 32-fach repliziert in 32768 Slots."],
            ["3 · Blind rechnen", "24 Blöcke: Newton-RMSNorm, Power-Softmax mit Newton-Division, Quadrat-Aktivierung, BSGS-Matrizen, Bootstrapping mehrmals pro Schicht."],
            ["4 · Entschlüsseln", "Residual entschlüsseln → finale Norm + LM-Head lokal → nächstes Token."]],
  },
};
let ver = "v1", busy = false;
const saved = {};

function renderVersion() {
  const V = VERS[ver];
  $("sub").innerHTML = V.sub;
  $("srvnote").textContent = V.srvnote; $("clinote").textContent = V.clinote;
  $("inp").maxLength = V.maxlen;
  $("chips").innerHTML = "";
  for (const e of V.examples) { const c = document.createElement("span"); c.className = "chip"; c.textContent = e; c.onclick = () => { $("inp").value = e; send(); }; $("chips").appendChild(c); }
  $("steps").innerHTML = V.steps.map(([b, t]) => `<div class="step"><b>${b}</b>${t}</div>`).join("");
  if (saved[ver]) { $("chat").innerHTML = saved[ver].chat; $("srv").innerHTML = saved[ver].srv; $("cli").innerHTML = saved[ver].cli; $("perf").textContent = saved[ver].perf; }
  else { $("chat").innerHTML = ""; $("srv").innerHTML = ""; $("cli").innerHTML = ""; $("perf").textContent = ""; addMsg("bot", V.intro); }
  for (const b of $("vswitch").children) b.classList.toggle("on", b.dataset.v === ver);
  loadStatus();
}
function switchTo(v) {
  if (busy || v === ver) return;
  saved[ver] = { chat: $("chat").innerHTML, srv: $("srv").innerHTML, cli: $("cli").innerHTML, perf: $("perf").textContent };
  ver = v; renderVersion();
}
async function loadVersions(render = true) {
  let vs = [];
  try { vs = await (await fetch("/api/versions")).json(); } catch (e) {}
  $("vswitch").innerHTML = "";
  for (const v of vs) {
    const b = document.createElement("button"); b.textContent = v.label; b.dataset.v = v.id; b.type = "button";
    b.disabled = !v.available; b.title = v.available ? v.url : `nicht erreichbar (${v.url || "nicht konfiguriert"})`;
    b.classList.toggle("on", v.id === ver);
    b.onclick = () => switchTo(v.id); $("vswitch").appendChild(b);
  }
  const first = vs.find((v) => v.available);
  if (first && !vs.find((v) => v.id === ver && v.available)) ver = first.id;
  if (render) renderVersion();
}

async function loadStatus() {
  const v = ver;
  $("pills").innerHTML = `<span class="pill">verbinde mit ${v} … (Schlüsselerzeugung)</span>`;
  try {
    const s = await (await fetch("/api/status?v=" + v)).json();
    if (v !== ver) return;
    if (v === "v3") {
      const m = s.model, f = m.fhe;
      $("pills").innerHTML = `
        <span class="pill ok">● verbunden · ${m.model}</span>
        <span class="pill">CKKS · N=<b>${s.ring_dim}</b> · ${s.slots} Slots · GPU</span>
        <span class="pill">128-Bit · log QP <b>${f.log_qp}</b> · h=${f.hamming_weight}</span>
        <span class="pill">Bootstrapping · <b>${f.levels}</b> Ebenen dazwischen</span>
        <span class="pill">Rotationsschlüssel <b>${f.rotation_keys}</b> (≈${f.key_gb} GB)</span>
        <span class="pill">Modell: <b>${m.n_layers}</b> Layer · d=${m.d_model} · Kontext ${s.max_context} · Softmax-Norm ${m.attn_norm}</span>
        <span class="pill warn">Demo: Client-Schlüssel im GPU-Prozess</span>`;
    } else {
      $("pills").innerHTML = `
        <span class="pill ok">● verbunden · Session <b>${s.session}</b></span>
        <span class="pill">CKKS · N=<b>${s.ring_dim}</b> · ${s.slots} Slots</span>
        <span class="pill">128-Bit · Tiefe <b>${s.model.fhe.depth}</b></span>
        <span class="pill">Eval-Keys <b>${s.eval_key_mb} MB</b> (Handshake ${s.handshake_s}s)</span>
        <span class="pill">Modell: <b>${s.model.n_layers}</b> Layer · d=${s.model.d_model} · Kontext ${s.max_context}</span>
        <span class="pill">Secret Key: <b>nur lokal</b></span>`;
    }
  } catch (e) { if (v === ver) $("pills").innerHTML = `<span class="pill">Server ${v} nicht erreichbar</span>`; }
}

function addMsg(cls, text) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; $("chat").appendChild(d); $("chat").scrollTop = 1e9; return d; }
function srvRow(ev) {
  const r = document.createElement("div"); r.className = "row";
  const extra = ev.boots !== undefined ? ` · ${ev.boots}× Bootstr.` : "";
  r.innerHTML = `<span class="p">#${ev.pos}</span><span>↑${ev.kb} kB${ev.back_kb ? "<br>↓" + ev.back_kb + " kB" : ""}</span><span class="hex" title="sha256 ${ev.sha}">${ev.hexprev}…${extra}</span><span class="t">${ev.server_s.toFixed(1)}s</span>`;
  $("srv").appendChild(r); $("srv").scrollTop = 1e9;
}
function cliRow(ev) {
  const r = document.createElement("div"); r.className = "dec";
  r.innerHTML = `<span class="p" style="color:var(--muted)">#${ev.pos}</span><div class="bars">` +
    ev.top.map(([c, p]) => `<span class="bar"><i style="width:${Math.round(p * 100)}%"></i><span>${String(c).replace(/ /g, "␣")} ${(p * 100).toFixed(1)}%</span></span>`).join("") + `</div>`;
  $("cli").appendChild(r); $("cli").scrollTop = 1e9;
}
const HOT = [["bootstrap_ms", "Bootstrapping", "#f0b84c"], ["linear_ptmul_ms", "Matrizen Ct×Pt", "#6ea8fe"], ["linear_rot_ms", "Matrizen Rotationen", "#3d6fc4"],
             ["attention_ms", "Attention Ct×Ct", "#4cc38a"], ["attention_rot_ms", "Attention Rot.", "#2f8a60"], ["nonlinear_ms", "Norm/Softmax/Akt.", "#c9a0ff"], ["other_ms", "Rest", "#6b7280"]];
function hotBar(h) {
  const tot = HOT.reduce((a, [k]) => a + (h[k] || 0), 0) || 1;
  return `<div class="hot">${HOT.map(([k, , c]) => `<i style="width:${100 * (h[k] || 0) / tot}%;background:${c}"></i>`).join("")}</div>
          <div class="legend">${HOT.map(([k, n, c]) => `<span style="--c:${c}">${n} ${(100 * (h[k] || 0) / tot).toFixed(0)}%</span>`).join("")}</div>`;
}

async function send() {
  const text = $("inp").value.trim(); if (!text || busy) return;
  busy = true; $("send").disabled = true; $("inp").value = "";
  for (const b of $("vswitch").children) b.disabled = true;
  addMsg("user", text);
  const bot = addMsg("bot typing", ""); let answer = "";
  const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = "verschlüssele …";
  const hot = document.createElement("div"); hot.className = "meta";
  const show = () => { bot.textContent = answer; bot.appendChild(meta); if (hot.innerHTML) bot.appendChild(hot); $("chat").scrollTop = 1e9; };
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, version: ver }) });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.kind === "status") { meta.textContent = ev.text; show(); }
        if (ev.kind === "upload") {
          srvRow(ev);
          meta.textContent = ev.phase === "prompt" ? `Prompt-Token ${ev.pos} verschlüsselt verarbeitet (${ev.server_s.toFixed(1)}s)` : `generiere … (${ev.server_s.toFixed(1)}s/Token)`;
          if (ev.hotspots) hot.innerHTML = hotBar(ev.hotspots);
          show();
        }
        if (ev.kind === "decrypt") cliRow(ev);
        if (ev.kind === "token") { answer += ev.text; show(); }
        if (ev.kind === "done") {
          bot.classList.remove("typing"); answer = ev.answer || "…";
          meta.textContent = `${ev.tokens} Tokens homomorph verarbeitet · ${ev.seconds}s`; show();
          $("perf").textContent = `${(ev.seconds / Math.max(1, ev.tokens)).toFixed(1)} s/Token`;
        }
      }
    }
  } catch (e) { bot.classList.remove("typing"); bot.textContent = "Fehler: " + e; }
  busy = false; $("send").disabled = false; $("inp").focus();
  loadVersions(false);
}
$("form").onsubmit = (e) => { e.preventDefault(); send(); };
loadVersions();
</script>
</body>
</html>
